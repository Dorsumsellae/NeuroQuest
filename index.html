<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NeuroQuest – Révisions Deep Learning</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="stage"></div>

<!-- HUD de jeu -->
<div id="hud" hidden>

  <div id="who"></div>
  <div id="ctx"></div>
  <pre id="qcode"></pre>
  <div id="q"></div>
  <div id="opts"></div>
</div>
<div id="pads" hidden><button id="bl" aria-label="Couloir gauche">◀</button><button id="bb" aria-label="Accélérer (maintenir)">⏩</button><button id="br" aria-label="Couloir droit">▶</button></div>
<div id="flash"></div>
<div id="fb"></div>

<!-- Écrans -->
<div id="menu" class="screen"></div>
<div id="ui"></div>
<div id="room"></div>
<div id="dlg"></div>

<script src="lib/three.min.js"></script>
<script src="lib/marked.min.js"></script>
<script src="content/notions.js"></script>

<script src="js/audio.js"></script>
<script src="js/progression.js"></script>
<script src="js/leaderboard.js"></script>
<script src="js/runner.js"></script>
<script src="js/minigames.js"></script>
